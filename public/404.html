<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haozhe Li — Portfolio</title>
    <script>
      (() => {
        const basePath = '/';
        const requestedPath =
          (window.location.pathname === basePath.slice(0, -1)
            ? basePath
            : window.location.pathname) +
          window.location.search +
          window.location.hash;

        if (
          window.location.pathname === basePath.slice(0, -1) ||
          window.location.pathname.startsWith(basePath)
        ) {
          window.location.replace(
            `${basePath}?route=${encodeURIComponent(requestedPath)}`,
          );
        }
      })();
    </script>
  </head>
  <body></body>
</html>
